name: Publish portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the website
        uses: actions/checkout@v6

      - name: Expand the initial website upload
        if: hashFiles('portfolio-*.zip') != ''
        run: |
          for archive in portfolio-*.zip; do
            python3 -m zipfile -e "$archive" .
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html work assets *.css *.js .nojekyll README.md
          git rm portfolio-*.zip
          git commit -m "Add the complete public portfolio website"
          git push

      - name: Prepare the public website
        run: |
          mkdir -p _site
          cp index.html about.html *.css *.js .nojekyll _site/
          cp -R assets work _site/

      - name: Upload the website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
